# DeepERC public test gate (LT-12 phase A).
#
# Runs the same `make test` a contributor runs locally: pytest minus the
# integration and gemma_smoke markers, then examples-smoke.
# Key-free by construction: no secret is referenced anywhere in this file, and
# pull_request runs from forks get a read-only token and no secrets.

name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - name: make test
        run: make test
