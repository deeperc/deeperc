[pytest]
# The maintained unit suite lives entirely under tests/ (747 tests). Scoping
# collection to tests/ deliberately excludes one file that is named test_*.py
# but is NOT a pytest suite and must not break the green gate:
#   * wip/phase_1_1_b_groundwork/test_peripheral_checker.py — tests a DEACTIVATED
#     Phase 1.1.b prototype whose check_peripheral_roles API no longer exists in
#     steps/ (see that dir's README.md). Preserved substrate, not a live test.
# A second standalone diagnostic, diag_extraction_quality.py, was renamed off its
# former test_extraction_quality.py name precisely to remove that re-collection
# trap: it drives the live MinerU->Gemma pipeline and its test_part() takes plain
# args, so pytest would mis-collect it as a fixture-driven test and error if the
# testpaths scoping were ever loosened. Run it by hand, not in the fast gate.
testpaths = tests

markers =
    integration: may hit network/external services (e.g. the L2 vendor lookup); not fast-gate essential
    gemma_smoke: exercises the dormant gemma_mineru extractor end-to-end against a local Ollama; auto-skips when Ollama is unreachable (select with -m gemma_smoke)
